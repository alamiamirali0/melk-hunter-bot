name: kashano-grab
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  actions: write
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: نصب
        run: |
          python -m pip install -q --upgrade pip
          pip install -q playwright openpyxl
          python -m playwright install --with-deps chromium
      - name: اجرا
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python kashano_ci.py
      - name: نوبت بعدی
        if: always()
        run: |
          code=000
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/disp.json -w "%{http_code}" -X POST \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/kashano.yml/dispatches" \
              -d '{"ref":"main"}')
            [ "$code" = "204" ] && break
            sleep 10
          done
          echo "dispatch next: $code"
