name: proxtest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: find working proxy
        id: findpx
        run: |
          for p in 1 2 3; do
            curl -s --max-time 20 "https://proxylist.geonode.com/api/proxy-list?country=IR&limit=100&page=$p&socks=false" -H "User-Agent: Mozilla/5.0" >> gn.json
            echo >> gn.json
          done
          python3 - <<'PY'
          import json, re
          cands = set()
          for chunk in open("gn.json", errors="ignore").read().split("},{"):
              try:
                  ip = re.search(r'"ip":"([^"]+)"', chunk).group(1)
                  port = re.search(r'"port":"?(\d+)"?', chunk).group(1)
                  proto = "socks5" if '"socks5"' in chunk else "http"
                  cands.add((ip, port, proto))
              except Exception:
                  pass
          lines = [f"{ip}:{port} {proto}" for ip, port, proto in sorted(cands)]
          open("proxies.txt", "w").write("\n".join(lines))
          print("candidates:", len(lines))
          PY
          WORKING=$(cat proxies.txt | xargs -P 12 -I{} sh -c '
            line="{}"; proto="${line##* }"; hostport="${line% *}";
            case "$proto" in socks5) xurl="socks5h://$hostport";; *) xurl="http://$hostport";; esac
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -x "$xurl" https://kashano.ir/ 2>/dev/null)
            [ "$code" = "200" ] && echo "$xurl"
          ' | head -5)
          echo "working:"; echo "$WORKING"
          echo "FIRST_PROXY=$(echo "$WORKING" | head -1)" >> "$GITHUB_OUTPUT"
      - name: fetch faq pages
        run: |
          PX="${{ steps.findpx.outputs.FIRST_PROXY }}"
          echo "using proxy: $PX"
          for u in "https://kashano.ir/" "https://kashano.ir/faq" "https://kashano.ir/help" "https://kashano.ir/contact-us"; do
            echo "===== $u ====="
            curl -s --max-time 25 -x "$PX" "$u" | python3 -c '
          import sys, re, html
          t = sys.stdin.read()
          t = re.sub(r"<script.*?</script>", " ", t, flags=re.S)
          t = re.sub(r"<style.*?</style>", " ", t, flags=re.S)
          t = re.sub(r"<[^>]+>", " ", t)
          t = html.unescape(t)
          t = " ".join(t.split())
          print(t[:4000])
          for m in re.finditer(r".{0,200}کد امنیتی.{0,200}", t):
              print("### پیدا شد:", m.group(0))
          for m in re.finditer(r".{0,200}(احراز IP|دفتر املاک|کد تایید).{0,200}", t):
              print("### مرتبط:", m.group(0))
          '
            # لینک‌های FAQ از صفحهٔ اصلی
            curl -s --max-time 25 -x "$PX" "https://kashano.ir/" | grep -oE 'href="[^"]*(faq|help|question|سوال)[^"]*"' | sort -u
          done
