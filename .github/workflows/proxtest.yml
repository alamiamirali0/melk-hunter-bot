name: proxtest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: collect and test IR proxies
        run: |
          set -x
          for p in 1 2 3 4 5; do
            curl -s --max-time 20 "https://proxylist.geonode.com/api/proxy-list?country=IR&limit=100&page=$p&socks=false" -H "User-Agent: Mozilla/5.0" >> gn.json
            echo >> gn.json
          done
          curl -s --max-time 20 "https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&country=ir&proxy_format=protocolipport&format=text&ports=8080,3128,1080,80,8118,9050" > ps.txt
          python3 - <<'PY'
          import json, re
          cands = set()
          for chunk in open("gn.json").read().split("}{"):
              try:
                  ip = re.search(r'"ip":"([^"]+)"', chunk).group(1)
                  port = re.search(r'"port":"?(\d+)"?', chunk).group(1)
                  proto = "http"
                  if '"socks5"' in chunk: proto = "socks5"
                  elif '"socks4"' in chunk: proto = "socks4"
                  cands.add((ip, port, proto))
              except Exception:
                  pass
          for line in open("ps.txt"):
              line = line.strip()
              if "://" in line:
                  proto, rest = line.split("://", 1)
                  ip, port = rest.rsplit(":", 1)
                  cands.add((ip, port, proto))
          lines = [f"{ip}:{port} {proto}" for ip, port, proto in sorted(cands)]
          open("proxies.txt", "w").write("\n".join(lines))
          print("candidates:", len(lines))
          PY
          wc -l proxies.txt
          cat proxies.txt | xargs -P 12 -I{} sh -c '
            line="{}"; proto="${line##* }"; hostport="${line% *}";
            case "$proto" in
              socks5) xurl="socks5h://$hostport";;
              socks4) xurl="socks4a://$hostport";;
              *) xurl="http://$hostport";;
            esac
            code=$(curl -s -o /tmp/b.$$ -w "%{http_code}" --max-time 12 -x "$xurl" https://kashano.ir 2>/dev/null)
            size=$(stat -c%s /tmp/b.$$ 2>/dev/null || echo 0)
            rm -f /tmp/b.$$
            if [ "$code" = "200" ] && [ "$size" -gt 1000 ]; then
              echo "WORKS | $proto $hostport"
            else
              echo "dead($code,$size) | $proto $hostport"
            fi
          ' | sort | tee results.txt
          echo "=== WORKING ==="
          grep -c "^WORKS" results.txt || true
          grep "^WORKS" results.txt || true
