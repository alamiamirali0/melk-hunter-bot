name: proxtest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: test proxies
        run: |
          echo "" | base64 -d > proxies.txt
          wc -l proxies.txt
          cat proxies.txt | xargs -P 10 -I{} sh -c '
            line="{}"; proto="${line##* }"; hostport="${line% *}";
            case "$proto" in
              socks5) xurl="socks5h://$hostport";;
              socks4) xurl="socks4a://$hostport";;
              *) xurl="http://$hostport";;
            esac
            body=$(curl -s --max-time 15 -x "$xurl" https://kashano.ir 2>/dev/null)
            code=$?
            size=${#body}
            if [ $code -eq 0 ] && echo "$body" | grep -q "داخل کشور"; then
              mark="BLOCKED_IP";
            elif [ $code -eq 0 ] && [ $size -gt 3000 ]; then
              mark="REAL_PAGE";
            elif [ $code -eq 0 ]; then
              mark="SMALL($size)";
            else
              mark="FAIL($code)";
            fi
            echo "$mark | $proto $hostport"
          ' | sort | tee results.txt
          echo "=== SUMMARY ==="
          echo "REAL_PAGE count: $(grep -c REAL_PAGE results.txt)"
          grep "REAL_PAGE" results.txt || echo "no real page"
