name: melk-hunter-relay

# ربات ملک هانتر — اجرای ۲۴ ساعته روی زیرساخت ابری گیت‌هاب
#
# طراحی «قطع‌نشوندنی» — چهار لایه:
#   ۱) handoff: اجرای فعلی ۱۵ دقیقه قبل از پایان، اجرای سایهٔ بعدی را بالا
#      می‌آورد (ci/handoff.yml) که منتظر نوبتش می‌ماند و به‌محض پایان این
#      اجرا، polling را در چند ثانیه می‌گیرد ⇒ وقفه ≈ ۰
#   ۲) زنجیرهٔ پایانی (scripts/chain.py): اگر لایهٔ ۱ کار نکند، در پایان
#      همین اجرا، اجرای بعدی را در صف می‌گذارد
#   ۳) زمان‌بندی ۶ ساعته: پشتیبانِ کلی
#   ۴) نگهبان مستقل هر ۱۰ دقیقه ضربان را می‌سنجد و در صورت خاموشی روشن می‌کند
# گروه concurrency یعنی همیشه فقط یک نمونهٔ relay هم‌زمان است (قانون
# Conflict تلگرام)؛ handoff گروهِ جدا دارد و «دست‌به‌دست» را بدون صف می‌کند.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"     # پشتیبانِ ۶ ساعته (زنجیرهٔ اصلی را handoff می‌سازد)

permissions:
  contents: write
  actions: write

concurrency:
  group: melk-hunter-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: نصب کتابخانه‌ها
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt

      - name: نصب موتور خواندن عکس و PDF (برای «افزودن از عکس» و فایل‌های PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fas poppler-utils
          tesseract --version | head -1
          pdftotext -v 2>&1 | head -1 || true

      - name: آماده‌سازی داده‌ها و تنظیمات (رمزگشایی دفترچه)
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          MELKBOT_TOKEN: ${{ secrets.MELKBOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
        run: python scripts/prepare_ci.py

      - name: روشن کردن ربات (با ترمیم خودکار) + گزارش زنده + فرستادنِ handoff
        env:
          MELKBOT_TOKEN: ${{ secrets.MELKBOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HANDOFF_AT_SEC: "19800"   # ۱۵ دقیقه قبل از پایان (۲۰۷۰۰s)
        run: |
          python scripts/status_pusher.py & PUSHER=$!
          sleep 2
          bash run_forever.sh 20700
          kill $PUSHER 2>/dev/null || true

      - name: ذخیرهٔ وضعیت کاربر در مخزن
        if: always()
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: python scripts/persist_state.py || true

      - name: زنجیرهٔ پشتیبان — اگر handoff نشده باشد
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MELKBOT_TOKEN: ${{ secrets.MELKBOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          CHAIN_WORKFLOW: "relay.yml"
        run: python scripts/chain.py || true

      - name: گزارش پایان
        if: always()
        run: tail -n 15 logs/bot.log 2>/dev/null || echo "لاگی ثبت نشد"
